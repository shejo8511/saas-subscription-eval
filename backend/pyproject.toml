[project]
name = "b2b-subscriptions-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.1",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "pydantic-settings==2.15.0",
  "pyjwt==2.15.1",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "httpx2==2.13.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = ["integration: requires an isolated real PostgreSQL database"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
